name: Deploy to GitHub Pages

# Builds the site (including the prerendered pages) on every push to main
# and publishes dist/website/browser to the gh-pages branch, which GitHub
# Pages serves at https://koenraad007.github.io/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx ng build

      - name: Publish to gh-pages
        run: >
          npx angular-cli-ghpages
          --dir=dist/website/browser
          --name="github-actions[bot]"
          --email="41898282+github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
